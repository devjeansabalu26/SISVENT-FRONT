<form class="form-page" [formGroup]="form" (ngSubmit)="save()"><app-page-header [title]="isEdit ? 'Editar producto' : 'Nuevo producto'" description="Información comercial y de inventario del producto"/><div class="form-grid"><div class="column"><section class="card"><h2>Información básica</h2><div class="fields"><label class="full">Nombre del producto *<input formControlName="name" placeholder="Ej. Mouse Gamer RGB Pro"/>@if(form.controls.name.touched&&form.controls.name.invalid){<span class="error">El nombre es obligatorio.</span>}</label><label class="full">Descripción<textarea formControlName="description"></textarea></label><label>SKU *<input formControlName="sku"/></label><label>Código de barras<input formControlName="barcode"/></label></div></section><section class="card"><h2>Categorización</h2><div class="fields"><label>Categoría *<select formControlName="category"><option value="">Seleccionar</option><option>Tecnología</option><option>Accesorios</option></select></label><label>Marca<select formControlName="brand"><option value="">Seleccionar</option><option>Logitech</option><option>Sony</option></select></label></div></section><section class="card"><h2>Precios</h2><div class="fields three"><label>Precio compra<input type="number" formControlName="purchasePrice"/></label><label>Precio venta *<input type="number" formControlName="salePrice"/></label><label>Margen<input [value]="margin+'%'" disabled/></label></div></section></div><div class="column"><section class="card"><h2>Inventario inicial</h2><label>Cantidad inicial *<input type="number" formControlName="stock"/></label><label>Stock mínimo<input type="number" formControlName="minimumStock"/></label></section><section class="card"><h2>Configuración</h2><label><span><input type="checkbox" formControlName="active"/> Producto activo</span></label></section></div></div><footer class="actions"><a routerLink="/app/products">Cancelar</a><button class="primary" type="submit">{{ isEdit ? 'Guardar cambios' : 'Guardar producto' }}</button></footer></form>
