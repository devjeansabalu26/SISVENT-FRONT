<app-page-header
  title="Sin movimiento y exceso"
  description="Identificación de capital inmovilizado y acciones correctivas — últimos 30 días"
/>

<div class="kpi-grid">
  @for (kpi of kpis; track kpi.label) {
    <app-kpi-card [label]="kpi.label" [value]="kpi.value" [icon]="kpi.icon" [tone]="kpi.tone" [caption]="kpi.hint" />
  }
</div>

<h2 class="section-title">Plan de acción de inventario inactivo</h2>
<p class="muted">Artículos que superan los 80 días recomendados de almacenamiento sin transacciones registradas.</p>
<app-data-table [columns]="columns" [rows]="rows()" [showEdit]="false" [showRemove]="false" />
