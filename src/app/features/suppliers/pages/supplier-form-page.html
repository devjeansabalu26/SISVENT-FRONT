<form class="form-page" [formGroup]="form" (ngSubmit)="save()">
  <app-page-header
    [title]="isEdit ? 'Editar proveedor' : 'Nuevo proveedor'"
    description="Datos de identificación y contacto del proveedor"
  />

  <section class="card">
    <h2>Identificación</h2>
    <div class="fields three">
      <label>RUC / Documento
        <input formControlName="taxDocument" />
        @if (form.controls.taxDocument.touched && form.controls.taxDocument.invalid) {
          <span class="error">Ingresa un documento válido.</span>
        }
      </label>
      <label class="full"><span>Razón social <span class="required">*</span></span>
        <input formControlName="businessName" />
        @if (form.controls.businessName.touched && form.controls.businessName.invalid) {
          <span class="error">La razón social es obligatoria.</span>
        }
      </label>
    </div>
  </section>

  <section class="card">
    <h2>Contacto</h2>
    <div class="fields three">
      <label>Nombre de contacto <input formControlName="contactName" /></label>
      <label>Teléfono <input formControlName="phone" /></label>
      <label>Correo electrónico
        <input type="email" formControlName="email" />
        @if (form.controls.email.touched && form.controls.email.invalid) {
          <span class="error">Ingresa un correo válido.</span>
        }
      </label>
    </div>
  </section>

  <section class="card">
    <h2>Dirección y notas</h2>
    <div class="fields">
      <label class="full">Dirección <input formControlName="address" placeholder="Av. Industrial 456" /></label>
      <label>Tiempo de reposición (días)
        <input type="number" min="1" max="180" formControlName="leadTimeDays" />
        @if (form.controls.leadTimeDays.touched && form.controls.leadTimeDays.invalid) {
          <span class="error">Ingresa entre 1 y 180 días.</span>
        } @else {
          <span class="note">Días desde el pedido hasta la recepción. Se usa para calcular las compras sugeridas.</span>
        }
      </label>
      <label class="full">Observaciones
        <textarea formControlName="notes" placeholder="Condiciones de pago, plazos de entrega…"></textarea>
      </label>
    </div>
    <label class="switch">
      <span><input type="checkbox" formControlName="isActive" /> Habilitado para compras e ingresos</span>
    </label>
  </section>

  <footer class="actions">
    <a routerLink="/app/suppliers">Cancelar</a>
    <button class="primary" type="submit" [disabled]="saving()">Guardar proveedor</button>
  </footer>
</form>
