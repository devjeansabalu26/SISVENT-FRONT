<app-page-header title="Proveedores" description="Gestión de proveedores">
  @if (canManage()) {
    <a class="primary" routerLink="/app/suppliers/new"><span class="material-icons">add</span>Nuevo proveedor</a>
  }
</app-page-header>

<div class="kpi-grid">
  <app-kpi-card label="Total proveedores" [value]="totalSuppliers()" icon="local_shipping" tone="primary" />
  <app-kpi-card label="Activos" [value]="activeSuppliers()" icon="check_circle" tone="success" />
</div>

<section class="filters">
  <label>
    <span class="material-icons">search</span>
    <input #box (input)="search.set(box.value)" placeholder="Buscar RUC, razón social, contacto…" />
  </label>
  <select #status aria-label="Estado" (change)="statusFilter.set(status.value)">
    <option value="">Estado: todos</option>
    <option value="ACTIVE">Activo</option>
    <option value="INACTIVE">Inactivo</option>
  </select>
</section>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [showEdit]="canManage()"
  [showRemove]="canManage()"
  editLabel="Editar proveedor"
  removeLabel="Deshabilitar proveedor"
  emptyMessage="No hay proveedores registrados."
  (edit)="edit($event)"
  (remove)="remove($event)"
/>
