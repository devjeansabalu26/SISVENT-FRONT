<form class="form-page" [formGroup]="form" (ngSubmit)="save()">
  <app-page-header [title]="isEdit ? 'Editar cliente' : 'Nuevo cliente'" description="Datos comerciales y de contacto del cliente"/>
  <section class="card"><h2>Documento de identificación</h2><div class="fields three"><label><span>Tipo de documento <span class="required">*</span></span><select formControlName="documentType"><option>DNI</option><option>RUC</option><option>CE</option></select></label><label><span>Número de documento <span class="required">*</span></span><input formControlName="documentNumber" placeholder="Escribe el número de documento"/>@if(form.controls.documentNumber.touched&&form.controls.documentNumber.invalid){<span class="error">Ingresa un documento válido.</span>}</label></div></section>
  <section class="card"><h2>Datos del cliente</h2><div class="fields three"><label><span>Nombre / Razón social <span class="required">*</span></span><input formControlName="displayName" placeholder="Escribe el nombre o razón social"/></label><label>Nombres<input formControlName="firstName" placeholder="Escribe los nombres"/></label><label>Apellidos<input formControlName="lastName" placeholder="Escribe los apellidos"/></label></div></section>
  <section class="card"><h2>Contacto y ubicación</h2><div class="fields three"><label><span>Teléfono <span class="required">*</span></span><input formControlName="phone" placeholder="Escribe el teléfono"/></label><label>Correo electrónico<input type="email" formControlName="email" placeholder="Escribe el correo electrónico"/>@if(form.controls.email.touched&&form.controls.email.invalid){<span class="error">Ingresa un correo válido.</span>}</label><label>Dirección<input formControlName="address" placeholder="Escribe la dirección"/></label></div></section>
  <section class="card"><h2>Información adicional</h2><label>Observaciones<textarea formControlName="notes" placeholder="Notas internas, condiciones de crédito o entregas…"></textarea></label><label class="check"><input type="checkbox" formControlName="active"/> Cliente activo</label></section>
  <footer class="actions"><a routerLink="/app/customers">Cancelar</a><button class="primary" type="submit" [disabled]="saving()">{{ isEdit ? 'Guardar cambios' : 'Guardar cliente' }}</button></footer>
</form>
