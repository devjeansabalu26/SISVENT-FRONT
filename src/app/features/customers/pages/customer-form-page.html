<form class="form-page" [formGroup]="form" (ngSubmit)="save()">
  <app-page-header [title]="isEdit ? 'Editar cliente' : 'Nuevo cliente'" description="Datos comerciales y de contacto del cliente"/>
  <section class="card"><h2>Documento de identificación</h2><div class="fields three"><label>Tipo de documento *<select formControlName="documentType"><option>DNI</option><option>RUC</option><option>CE</option></select></label><label>Número de documento *<input formControlName="document"/>@if(form.controls.document.touched&&form.controls.document.invalid){<span class="error">Ingresa un documento válido.</span>}</label></div></section>
  <section class="card"><h2>Datos del cliente</h2><div class="fields three"><label>Nombres *<input formControlName="names"/></label><label>Apellidos<input formControlName="lastNames"/></label><label>Razón social (solo RUC)<input formControlName="legalName"/></label></div></section>
  <section class="card"><h2>Contacto y ubicación</h2><div class="fields three"><label>Teléfono *<input formControlName="phone"/></label><label>Correo electrónico *<input type="email" formControlName="email"/>@if(form.controls.email.touched&&form.controls.email.invalid){<span class="error">Ingresa un correo válido.</span>}</label><label>Dirección *<input formControlName="address"/></label><label>Ciudad / Distrito *<input formControlName="district"/></label><label>Departamento *<input formControlName="department"/></label></div></section>
  <section class="card"><h2>Información adicional</h2><label>Observaciones<textarea formControlName="notes" placeholder="Notas internas, condiciones de crédito o entregas…"></textarea></label></section>
  <footer class="actions"><a routerLink="/app/customers">Cancelar</a><button class="primary" type="submit">{{ isEdit ? 'Guardar cambios' : 'Guardar cliente' }}</button></footer>
</form>
