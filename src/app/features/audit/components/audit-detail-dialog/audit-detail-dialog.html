<section class="dialog"><header><span class="material-icons">manage_search</span><div><h2>Detalle de auditoría</h2><p>{{event.id}} · {{event.date}}</p></div></header><dl><div><dt>Usuario</dt><dd>{{event.user}} ({{event.role}})</dd></div><div><dt>Empresa</dt><dd>{{event.company}}</dd></div><div><dt>Módulo</dt><dd>{{event.module}}</dd></div><div><dt>Acción</dt><dd>{{event.action}}</dd></div><div><dt>Dirección IP</dt><dd>{{event.ip}}</dd></div><div class="wide"><dt>Detalle</dt><dd>{{event.detail}}</dd></div></dl><footer><button type="button" (click)="close()">Cerrar</button></footer></section>
