<app-page-header title="Categorías" description="Catálogo de categorías de tu empresa">
  @if (canManage()) {
    <button type="button" class="primary" (click)="create()">
      <span class="material-icons">add</span>Nueva categoría
    </button>
  }
</app-page-header>

<section class="filters">
  <label>
    <span class="material-icons">search</span>
    <input #box (input)="search.set(box.value)" placeholder="Buscar categoría…" />
  </label>
</section>

<app-data-table
  [columns]="columns"
  [rows]="rows()"
  [loading]="loading()"
  [showEdit]="canManage()"
  [showRemove]="canManage()"
  editLabel="Editar categoría"
  removeLabel="Desactivar categoría"
  emptyMessage="No hay categorías registradas."
  (edit)="edit($event)"
  (remove)="remove($event)"
/>
