<form class="dialog" [formGroup]="form" (ngSubmit)="confirm()">
  <header>
    <span class="material-icons">swap_horiz</span>
    <div>
      <h2>Cambiar plan de empresa</h2>
      <p>{{ data.companyName }} · Plan actual: {{ data.currentPlan }}</p>
    </div>
  </header>

  <div class="fields">
    <label class="wide"
      ><span>Nuevo plan <span class="required">*</span></span>
      <select formControlName="planId" [class.invalid]="showError('planId')">
        @for (plan of plans(); track plan.id) {
          <option [value]="plan.id">{{ plan.name }} @if (plan.currentPrice != null) { (S/ {{ plan.currentPrice.toFixed(2) }}) }</option>
        }
      </select>
      @if (showError('planId')) {
        <small class="hint">Selecciona el nuevo plan.</small>
      }
    </label>
    <label class="wide"
      ><span>Precio contratado <span class="required">*</span></span>
      <input type="number" step="0.01" min="0" formControlName="contractedPrice" placeholder="Escribe el precio contratado (ej. 149.90)" [class.invalid]="showError('contractedPrice')" />
      @if (showError('contractedPrice')) {
        <small class="hint">
          @if (form.controls.contractedPrice.hasError('required')) { Ingresa el precio contratado. }
          @else if (form.controls.contractedPrice.hasError('min')) { El precio no puede ser negativo. }
          @else { El precio excede el máximo permitido. }
        </small>
      }
    </label>
    <label class="wide"
      ><span>Fecha de inicio <span class="required">*</span></span>
      <input type="date" formControlName="startDate" [class.invalid]="showError('startDate')" />
      @if (showError('startDate')) {
        <small class="hint">Indica la fecha de inicio.</small>
      }
    </label>
    <label class="wide"
      ><span>Fecha de fin <span class="required">*</span></span>
      <input type="date" formControlName="endDate" [min]="form.controls.startDate.value" [class.invalid]="showError('endDate')" />
      @if (showError('endDate')) {
        <small class="hint">
          @if (form.controls.endDate.hasError('required')) { Indica la fecha de fin. }
          @else { La fecha de fin no puede ser anterior a la de inicio. }
        </small>
      }
    </label>
    <label class="wide"
      ><span>Motivo del cambio <span class="required">*</span></span>
      <textarea formControlName="reason" maxlength="500" placeholder="Escribe el motivo del cambio de plan…" [class.invalid]="showError('reason')"></textarea>
      @if (showError('reason')) {
        <small class="hint">Describe el motivo (mínimo 5 caracteres).</small>
      }
    </label>
    <p class="muted">El cambio de plan puede afectar funcionalidades activas inmediatamente.</p>
  </div>

  <footer>
    <button type="button" (click)="cancel()">Cancelar</button>
    <button type="submit" class="primary" [disabled]="form.invalid">Confirmar cambio</button>
  </footer>
</form>
