<app-page-header
  [title]="isAdmin ? 'Historial de ventas' : 'Mis ventas'"
  [description]="isAdmin ? 'Registro completo de operaciones de venta' : 'Ventas registradas con tu usuario'"
>
  @if (isAdmin) {<button class="ghost" type="button" (click)="closeCash()"><span class="material-icons">point_of_sale</span>Cierre de caja</button>}
</app-page-header>
<section class="filters sales-filters">
  <label><span class="material-icons">search</span><input [(ngModel)]="search" (keyup.enter)="load()" placeholder="Nro de venta o cliente" /></label>
  <input type="date" [(ngModel)]="from" aria-label="Fecha desde" />
  <input type="date" [(ngModel)]="to" aria-label="Fecha hasta" />
  <select [(ngModel)]="paymentMethod" aria-label="Método de pago">
    <option value="">Todos los métodos</option>
    @for (option of paymentOptions; track option.value) {<option [value]="option.value">{{ option.label }}</option>}
  </select>
  <select [(ngModel)]="status" aria-label="Estado">
    <option value="">Todos los estados</option>
    <option value="CONFIRMED">Confirmada</option>
    <option value="CANCELLED">Anulada</option>
  </select>
  <div class="sales-filters__actions">
    <button type="button" class="ghost" (click)="clearFilters()">Limpiar</button>
    <button type="button" (click)="load()">Filtrar</button>
  </div>
</section>
<app-data-table [columns]="columns" [rows]="rows()" [loading]="loading()" [showRemove]="true" editLabel="Ver detalle" editIcon="visibility" removeLabel="Ver comprobante" removeIcon="receipt_long" (edit)="open($event)" (remove)="receipt($event)" [customEmpty]="true">
  @if (hasFilters()) {
    <app-empty-state tableEmpty flush icon="search_off" title="Sin resultados de búsqueda"
      description="No pudimos encontrar nada que coincida con tus términos de filtro. Intenta con otra palabra clave o limpia los filtros."
      actionLabel="Limpiar filtros" (action)="clearFilters()" />
  } @else {
    <app-empty-state tableEmpty flush icon="point_of_sale" title="Sin ventas registradas"
      description="Las ventas de esta empresa aparecerán aquí una vez que realices tu primera venta."
      actionLabel="Nueva venta" (action)="newSale()" />
  }
</app-data-table>
<section class="totals"><span>Operaciones: <strong>{{ totals().operationCount }}</strong></span><span>Total ventas: <strong>S/ {{ totals().totalAmount.toFixed(2) }}</strong></span></section>
