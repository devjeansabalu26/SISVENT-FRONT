<app-page-header title="Historial de ventas" description="Registro completo de operaciones de venta">@if (isAdmin) {<button class="ghost" type="button" (click)="closeCash()"><span class="material-icons">point_of_sale</span>Cierre de caja</button>}<button class="primary" type="button"><span class="material-icons">download</span>Exportar reporte</button></app-page-header><section class="filters"><input type="date" aria-label="Fecha desde"/><input type="date" aria-label="Fecha hasta"/><label><span class="material-icons">search</span><input placeholder="Cliente o documento…" /></label><select aria-label="Vendedor"><option>Vendedor</option></select><select aria-label="Local"><option>Local</option></select><select aria-label="Método de pago"><option>Método de pago</option></select><select aria-label="Estado"><option>Estado</option></select><button type="button">Filtrar</button></section><app-data-table [columns]="columns" [rows]="rows()" editLabel="Ver detalle" editIcon="visibility" removeLabel="Ver comprobante" removeIcon="receipt_long" (edit)="open($event)" (remove)="receipt($event)" /><section class="totals"><span>Operaciones: <strong>{{rows().length}}</strong></span><span>Total ventas: <strong>S/ {{total().toFixed(2)}}</strong></span></section>
