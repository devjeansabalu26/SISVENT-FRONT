<section class="success">
  <span class="success__icon material-icons">check_circle</span>
  <h2>Venta registrada correctamente</h2>
  <p>Comprobante de pago generado con éxito</p>

  <dl>
    <div><dt>Operación</dt><dd>{{ data.saleNumber }}</dd></div>
    <div><dt>Cliente</dt><dd>{{ data.customer }}</dd></div>
    <div><dt>Método de pago</dt><dd>{{ data.paymentMethod }}</dd></div>
    <div><dt>Monto total</dt><dd>S/ {{ data.total.toFixed(2) }}</dd></div>
  </dl>

  <footer>
    <button type="button" class="ghost" (click)="close('print')"><span class="material-icons">print</span>Imprimir</button>
    <button type="button" class="ghost" (click)="close('detail')"><span class="material-icons">visibility</span>Ver detalle</button>
    <button type="button" class="primary" (click)="close('new')"><span class="material-icons">add</span>Nueva venta</button>
  </footer>
</section>
