<app-page-header title="Centro de notificaciones" description="Alertas y avisos del sistema">
  <button type="button" class="ghost" (click)="markAllRead()">
    <span class="material-icons">done_all</span>Marcar todas como leídas
  </button>
</app-page-header>

<nav class="tabs" aria-label="Filtro de notificaciones">
  @for (tab of tabs; track tab.id) {
    <button type="button" [class.active]="activeTab() === tab.id" (click)="activeTab.set(tab.id)">
      {{ tab.label }} <span class="count">{{ countFor(tab.id) }}</span>
    </button>
  }
</nav>

<ul class="feed">
  @for (item of visible(); track item.id) {
    <li class="note" [class.note--unread]="!item.read" (click)="markRead(item)">
      <span class="badge" [attr.data-priority]="item.priority">{{ item.priority }}</span>
      <div class="note__body">
        <div class="note__head">
          <strong>{{ item.title }}</strong>
          <small>{{ item.timeAgo }}</small>
        </div>
        <p>{{ item.body }}</p>
        <div class="note__meta">
          <span class="chip">{{ item.category }}</span>
          @for (action of item.actions; track action) {
            <button type="button" class="link">{{ action }}</button>
          }
        </div>
      </div>
    </li>
  } @empty {
    <li>
      <app-empty-state
        icon="notifications_off"
        title="Sin notificaciones"
        description="No hay avisos en esta vista. Cuando el sistema genere alertas o eventos, aparecerán aquí."
      />
    </li>
  }
</ul>
