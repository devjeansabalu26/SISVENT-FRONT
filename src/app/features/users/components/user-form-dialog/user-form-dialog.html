<form class="dialog" [formGroup]="form" (ngSubmit)="save()">
  <header><span class="material-icons">person_add</span><div><h2>{{ user ? 'Editar usuario' : 'Nuevo usuario' }}</h2><p>Define sus datos y nivel de acceso</p></div></header>
  <div class="fields">
    <label>Nombres<input formControlName="firstName" placeholder="Nombres" /></label>
    <label>Apellidos<input formControlName="lastName" placeholder="Apellidos" /></label>
    <label class="wide">Correo electrónico<input type="email" formControlName="email" placeholder="usuario@empresa.com" />
      @if (user) { <small class="muted">El correo no se puede cambiar una vez creado el usuario.</small> }
    </label>
    <label>Documento<input inputmode="numeric" formControlName="document" placeholder="DNI o documento" /></label>
    <label>Teléfono<input formControlName="phone" placeholder="Teléfono" /></label>
    <label>Rol<select formControlName="role"><option value="ADMIN">Administrador</option><option value="VENDEDOR">Vendedor</option></select></label>
    @if (form.controls.role.value === 'VENDEDOR') {
      <label>Local
        <select formControlName="storeId">
          <option [ngValue]="null">Sin asignar</option>
          @for (store of stores(); track store.id) {
            <option [ngValue]="store.id">{{ store.name }}</option>
          }
        </select>
      </label>
      <label class="check">
        <input type="checkbox" formControlName="canViewAllStores" />
        <span>Puede ver productos y stock de otros locales <small>(solo consulta; vende y ajusta solo en su local)</small></span>
      </label>
    }
  </div>
  <footer><button type="button" (click)="cancel()">Cancelar</button><button type="submit" class="primary">Guardar usuario</button></footer>
</form>
