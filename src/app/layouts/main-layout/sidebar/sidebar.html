<aside class="sidebar" [class.sidebar--compact]="compact()">
  <a class="brand" routerLink="/app/dashboard" aria-label="Ir al inicio"
    ><span class="brand__mark">S</span><strong>SISVENT</strong></a
  >
  <div class="company">{{ company()?.commercialName ?? 'SISVENT Multiempresa' }}</div>
  <nav aria-label="Navegación principal">
    @for (group of groups(); track group.label) {
      @if (group.label) {
        <p class="nav-group">{{ group.label }}</p>
      }
      @for (item of group.items; track item.route) {
        <a [routerLink]="item.route" routerLinkActive="active" (click)="navigate.emit()"
          ><span class="material-icons" aria-hidden="true">{{ item.icon }}</span
          ><span>{{ item.label }}</span></a
        >
      }
    }
  </nav>
</aside>
